services:
  magnolia:
    build:
      context: .
    ports:
      - "${MAGNOLIA_PORT:-8081}:8080"
    environment:
      CATALINA_OPTS: -Xms256m -Xmx3072m -Djava.awt.headless=true
    volumes:
      - ./light-modules:/opt/magnolia/light-modules:ro
      - magnolia-author-repositories:/opt/magnolia/apache-tomcat/webapps/magnoliaAuthor/repositories
      - magnolia-author-activation-key:/opt/magnolia/apache-tomcat/webapps/magnoliaAuthor/WEB-INF/config/activation-key
      - magnolia-public-repositories:/opt/magnolia/apache-tomcat/webapps/magnoliaPublic/repositories
    restart: unless-stopped

  beta-portal:
    build:
      context: ./beta-portal
    ports:
      - "127.0.0.1:${BETA_PORT:-3090}:3000"
    environment:
      BETA_PORT: "3000"
      BETA_DATA_DIR: /app/data
      BETA_PUBLIC_ORIGIN: http://127.0.0.1:${BETA_PORT:-3090}
      BETA_COOKIE_SECURE: "false"
    volumes:
      - beta-portal-data:/app/data
    restart: unless-stopped

volumes:
  magnolia-author-repositories:
  magnolia-author-activation-key:
  magnolia-public-repositories:
  beta-portal-data:
