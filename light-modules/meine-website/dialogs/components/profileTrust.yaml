      i18n: true
    signature:
      label: Signatur
      $type: textField
      i18n: true
    aboutMode:
      label: Darstellung für „Über mich“
      $type: checkBoxField
      buttonLabel: Porträt beim Scrollen stehen lassen
    linkText:
      label: Linktext
      $type: textField
      i18n: true
    targetPage:
      label: Linkziel
      $type: pageLinkField
      converterClass: info.magnolia.ui.editor.converter.JcrNodeToPathConverter

