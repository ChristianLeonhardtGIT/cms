      label: Kleine Überschrift
      $type: textField
      i18n: true
    heading:
      label: Abschnittsüberschrift
      $type: textField
      i18n: true
      required: true
    title:
      label: Profilüberschrift
      $type: textField
      i18n: true
      required: true
    lead:
      label: Einleitung
      $type: textAreaField
