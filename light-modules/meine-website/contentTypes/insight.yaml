datasource:
  workspace: insights
  autoCreate: true

model:
  properties:
    - name: title
      label: Titel
      type: String
      i18n: true
      required: true
    - name: slug
      label: Slug
      type: String
      required: true
    - name: teaser
      label: Kurzbeschreibung
      type: String
      i18n: true
      required: true
    - name: body
      label: Inhalt
      type: richText
      i18n: true
      required: true
    - name: keyTakeaway
      label: Kerngedanke
      type: String
      i18n: true
    - name: sourcePage
      label: Bestehende Website-Seite
      type: reference:page
    - name: topics
      label: Themen
      type: reference:topic
      multiple: true
    - name: relatedProblems
      label: Zugehörige Problemsituationen
      type: reference:problem
      multiple: true
    - name: relatedTools
      label: Passende Tools
      type: reference:tool
      multiple: true
    - name: relatedOffers
      label: Passende Leistungen
      type: reference:offer
      multiple: true
    - name: seo
      label: SEO und Social Media
      type: seoMetadata
    - name: publishing
      label: Veröffentlichung
      type: publishingMetadata

  subModels:
    - !include:/meine-website/includes/content/seo-properties.yaml
    - !include:/meine-website/includes/content/publishing-properties.yaml
