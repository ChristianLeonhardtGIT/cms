datasource:
  workspace: topics
  autoCreate: true

model:
  properties:
    - name: title
      label: Titel
      type: String
      i18n: true
      required: true
    - name: slug
      label: Slug
      type: String
      required: true
    - name: description
      label: Beschreibung
      type: String
      i18n: true
    - name: sortOrder
      label: Sortierung
      type: Long
    - name: active
      label: Aktiv
      type: Boolean
